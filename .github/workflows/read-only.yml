name: Read-only

on:
  issues:
    types: [opened, reopened]
  pull_request_target:
    types: [opened, reopened]

permissions:
  issues: write
  pull-requests: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Close outside contributions
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          ASSOCIATION: ${{ github.event.issue.author_association || github.event.pull_request.author_association }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          case "$ASSOCIATION" in
            OWNER|MEMBER|COLLABORATOR) exit 0 ;;
          esac
          message="This repository is public and read-only. Issues and pull requests are closed."
          if [ "$EVENT" = "issues" ]; then
            gh issue close "$NUMBER" --repo "$REPO" --reason "not planned" --comment "$message"
          else
            gh pr close "$NUMBER" --repo "$REPO" --comment "$message"
          fi
