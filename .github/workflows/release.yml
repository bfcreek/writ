name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, such as v1.2.3 or v1.2.3-preview.1
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Resolve version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Refusing '$tag'. Use v1.2.3 or v1.2.3-preview.1."
            exit 1
          fi
          version="${tag#v}"
          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  test:
    name: Test (${{ matrix.os }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Check PowerShell
        shell: pwsh
        run: Write-Host "pwsh $($PSVersionTable.PSVersion)"

      - name: Test
        run: dotnet test Writ.sln -c Release --verbosity minimal

  publish:
    name: Publish (${{ matrix.rid }})
    needs: [prepare, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64, linux-x64, linux-arm64, osx-x64, osx-arm64]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Publish self-contained binary
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          RID: ${{ matrix.rid }}
        shell: bash
        run: |
          set -euo pipefail
          stage="publish/$RID"
          dotnet publish src/Writ.Cli/Writ.Cli.csproj \
            -c Release \
            -r "$RID" \
            --self-contained true \
            -p:Version="$VERSION" \
            -p:IncludeSourceRevisionInInformationalVersion=false \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:DebugType=embedded \
            -o "$stage"
          if [ -f "$stage/writ" ]; then
            chmod +x "$stage/writ"
          fi
          archive="writ-${VERSION}-${RID}.zip"
          (cd "$stage" && zip -r "../$archive" .)

      - uses: actions/upload-artifact@v7
        with:
          name: writ-${{ matrix.rid }}
          path: publish/writ-${{ needs.prepare.outputs.version }}-${{ matrix.rid }}.zip
          if-no-files-found: error

  release:
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: writ-*
          merge-multiple: true

      - name: Pack .NET tool
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          dotnet pack src/Writ.Cli/Writ.Cli.csproj \
            -c Release \
            -p:Version="$VERSION" \
            -p:IncludeSourceRevisionInInformationalVersion=false \
            -p:DebugType=embedded \
            -o dist

      - name: Checksums
        shell: bash
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum writ-* > SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          args=(release create "$TAG" dist/* --title "$TAG" --generate-notes --verify-tag)
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh "${args[@]}"
          fi
