name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, such as v1.2.3 or v1.2.3-preview.1
        required: true
        type: string

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Resolve version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Refusing '$tag'. Use v1.2.3 or v1.2.3-preview.1."
            exit 1
          fi
          version="${tag#v}"
          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  test:
    name: Test (${{ matrix.os }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Check PowerShell
        shell: pwsh
        run: Write-Host "pwsh $($PSVersionTable.PSVersion)"

      - name: Test
        run: dotnet test Writ.sln -c Release --verbosity minimal

  publish:
    name: Publish (${{ matrix.rid }})
    needs: [prepare, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64, linux-x64, linux-arm64, osx-x64, osx-arm64]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Publish self-contained binary
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          RID: ${{ matrix.rid }}
        shell: bash
        run: |
          set -euo pipefail
          stage="publish/$RID"
          dotnet publish src/Writ.Cli/Writ.Cli.csproj \
            -c Release \
            -r "$RID" \
            --self-contained true \
            -p:Version="$VERSION" \
            -p:IncludeSourceRevisionInInformationalVersion=false \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:DebugType=embedded \
            -o "$stage"
          if [ -f "$stage/writ" ]; then
            chmod +x "$stage/writ"
          fi
          archive="writ-${VERSION}-${RID}.zip"
          (cd "$stage" && zip -r "../$archive" .)

      - uses: actions/upload-artifact@v7
        with:
          name: writ-${{ matrix.rid }}
          path: publish/writ-${{ needs.prepare.outputs.version }}-${{ matrix.rid }}.zip
          if-no-files-found: error

  installer:
    name: Installer (${{ matrix.rid }})
    needs: [prepare, publish]
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            platform: x64
          - rid: win-arm64
            platform: arm64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - uses: actions/download-artifact@v8
        with:
          name: writ-${{ matrix.rid }}
          path: installer/stage

      - name: Stage writ.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Get-ChildItem -Path installer/stage -Filter "writ-*.zip" -File | Select-Object -First 1
          if (-not $zip) { throw "No published zip in installer/stage." }
          New-Item -ItemType Directory -Force -Path installer/payload | Out-Null
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath installer/payload -Force
          if (-not (Test-Path installer/payload/writ.exe)) { throw "The zip did not contain writ.exe." }

      - name: MSI version
        id: msi
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:VERSION -notmatch '^(\d+\.\d+\.\d+)') { throw "Version '$env:VERSION' has no major.minor.patch." }
          "version=$($Matches[1])" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8NoBOM

      - name: Build MSI
        shell: pwsh
        run: >
          dotnet build installer/Writ.wixproj -c Release
          -p:Platform=${{ matrix.platform }}
          -p:MsiVersion=${{ steps.msi.outputs.version }}
          -p:PackageVersion=${{ needs.prepare.outputs.version }}
          -p:RuntimeIdentifier=${{ matrix.rid }}

      - uses: actions/upload-artifact@v7
        with:
          name: writ-${{ matrix.rid }}-msi
          path: installer/bin/${{ matrix.platform }}/*.msi
          if-no-files-found: error

  release:
    needs: [prepare, publish, installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: writ-*
          merge-multiple: true

      - name: Pack .NET tool
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          dotnet pack src/Writ.Cli/Writ.Cli.csproj \
            -c Release \
            -p:Version="$VERSION" \
            -p:IncludeSourceRevisionInInformationalVersion=false \
            -p:DebugType=embedded \
            -o dist

      - name: Checksums
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        working-directory: dist
        run: |
          set -euo pipefail
          expected=(
            "writ-${VERSION}-win-x64.zip"
            "writ-${VERSION}-win-arm64.zip"
            "writ-${VERSION}-linux-x64.zip"
            "writ-${VERSION}-linux-arm64.zip"
            "writ-${VERSION}-osx-x64.zip"
            "writ-${VERSION}-osx-arm64.zip"
            "writ-${VERSION}-win-x64.msi"
            "writ-${VERSION}-win-arm64.msi"
            "Writ.Cli.${VERSION}.nupkg"
          )
          missing=0
          for name in "${expected[@]}"; do
            if [ ! -f "$name" ]; then
              echo "Missing $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Release files:"
            ls -la
            exit 1
          fi
          sha256sum "${expected[@]}" > SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}" --force
          tag_notes=$(git for-each-ref "refs/tags/${TAG}" --format='%(contents)')
          notes=$(mktemp)
          {
            if [ -n "${tag_notes//[$' \t\r\n']/}" ]; then
              printf '## Release notes\n\n%s\n\n' "$tag_notes"
            fi
            cat <<EOF
          ## Install

          - Windows: \`writ-${VERSION}-win-x64.msi\` or \`writ-${VERSION}-win-arm64.msi\`. Per-user, no administrator prompt. Installs \`writ.exe\` on PATH.
          - Other platforms: unzip \`writ-${VERSION}-<rid>.zip\` (\`linux-x64\`, \`linux-arm64\`, \`osx-x64\`, \`osx-arm64\`, \`win-x64\`, \`win-arm64\`).
          - .NET tool: \`Writ.Cli.${VERSION}.nupkg\`.

          Generated programs run on the Machine runtime in process. \`writ version\` prints ${VERSION}.

          EOF
            gh api \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="$TAG" \
              --jq .body
          } > "$notes"
          args=(release create "$TAG" dist/* --title "$TAG" --notes-file "$notes" --verify-tag)
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            edit=(release edit "$TAG" --notes-file "$notes")
            if [ "$PRERELEASE" = "true" ]; then
              edit+=(--prerelease)
            fi
            gh "${edit[@]}"
          else
            gh "${args[@]}"
          fi
